name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.gateship/issues/**'
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run all gates
        run: bun run check:all
      - name: Build the container image
        run: docker build --build-arg GSHIP_BUILD_SHA="${{ github.sha }}" -t gateship:ci .
      - name: Verify both agent CLIs respond inside the built image
        run: |
          docker run --rm --entrypoint claude gateship:ci --version
          docker run --rm --entrypoint codex gateship:ci --version
