name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install tmux
        run: brew install tmux
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Run all gates
        run: bun run check:all -- --json
      - name: Write gate timing to step summary
        if: always()
        run: |
          [ -f gate-results.json ] || exit 0
          echo "| Gate | Status | Duration |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|----------|" >> $GITHUB_STEP_SUMMARY
          jq -r '.[] | "| \(.name) | \(.status) | \(.durationMs)ms |"' gate-results.json >> $GITHUB_STEP_SUMMARY
