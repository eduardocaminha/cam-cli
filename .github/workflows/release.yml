name: Release

# Triggered by a version tag push. Cross-compiles all four release targets from
# one macOS runner and publishes them as prerelease assets, and separately
# builds and publishes the matching versioned container image from a Linux
# runner (the macOS-hosted runner has no Docker daemon).
on:
  push:
    tags:
      - 'v*'

permissions:
  artifact-metadata: write
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Build all four release targets
        run: bun run build:release
      - name: Attest build provenance for the four binaries
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/gateship-darwin-arm64
            dist/gateship-darwin-x64
            dist/gateship-linux-x64
            dist/gateship-linux-arm64
      - name: Publish prerelease with the four binaries and checksum manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            dist/gateship-darwin-arm64 \
            dist/gateship-darwin-x64 \
            dist/gateship-linux-x64 \
            dist/gateship-linux-arm64 \
            dist/SHA256SUMS.txt \
            --prerelease \
            --title "$TAG" \
            --generate-notes

  release-image:
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GSHIP_BUILD_SHA is the same build-arg build-release.sh's binaries bake
      # in via `--define`, and the Dockerfile's own ARG of the same name (see
      # compose.yaml) -- so resolveBootSourceSha's old-service warning reads
      # the released commit inside this image exactly as it does outside it.
      - name: Build and push the versioned container image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GSHIP_BUILD_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name: Attest build provenance for the container image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
