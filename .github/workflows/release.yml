name: Release

# Triggered by a version tag push. Cross-compiles all four release targets from
# one macOS runner and publishes them as prerelease assets.
on:
  push:
    tags:
      - 'v*'

permissions:
  artifact-metadata: write
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Build all four release targets
        run: bun run build:release
      - name: Attest build provenance for the four binaries
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/gateship-darwin-arm64
            dist/gateship-darwin-x64
            dist/gateship-linux-x64
            dist/gateship-linux-arm64
      - name: Publish prerelease with the four binaries and checksum manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            dist/gateship-darwin-arm64 \
            dist/gateship-darwin-x64 \
            dist/gateship-linux-x64 \
            dist/gateship-linux-arm64 \
            dist/SHA256SUMS.txt \
            --prerelease \
            --title "$TAG" \
            --generate-notes
