# One image, one volume, one process supervising its children (AGENTS.md).
# GATESHIP_PROJECT_DIR is the git repository Gateship manages -- the current
# directory by default. The published port stays bound to the host's loopback
# only, so the container is reachable exactly like the local binary was:
# from this machine alone.
#
#   GSHIP_BUILD_SHA=$(git rev-parse HEAD) GATESHIP_PROJECT_DIR=/path/to/project docker compose up
#
# GSHIP_BUILD_SHA is optional -- an unset one still builds, it just leaves the
# image unable to say what commit it came from (see the Dockerfile and
# resolveBootSourceSha in src/commands/web.ts, GSHIP-654).
#
# GATESHIP_IMAGE names the tag `image:` resolves to. Left unset it stays
# `gateship:latest`, which nothing publishes, so Compose's default
# pull-if-missing policy fails the pull and falls back to the `build:` below
# -- the local, from-source path this file always had, kept as the
# development default. Point it at a tag the release workflow published
# instead -- `ghcr.io/gateship-dev/gateship:<version>` or `:<commit-sha>`,
# both built with the same GSHIP_BUILD_SHA as the release binaries (see
# .github/workflows/release.yml) -- and Compose pulls that image instead of
# building:
#
#   GATESHIP_IMAGE=ghcr.io/gateship-dev/gateship:v1.2.3 docker compose up
#
# The named volume below is mounted over ./.gship inside that repository,
# which is where the SQLite store, managed worktrees and (via
# CLAUDE_CONFIG_DIR/CODEX_HOME/GH_CONFIG_DIR in the Dockerfile) the Claude,
# Codex and GitHub CLI logins already live. Recreating the container against
# the same project directory and the same volume returns the operator to the
# same place.
services:
  gateship:
    build:
      context: .
      args:
        GSHIP_BUILD_SHA: ${GSHIP_BUILD_SHA:-}
    image: ${GATESHIP_IMAGE:-gateship:latest}
    init: true
    # The repository and named state volume are the only durable write
    # surfaces. Everything baked into the image stays immutable, and a child
    # cannot gain privileges through a setuid/setgid binary. Root retains only
    # the two filesystem capabilities needed to operate bind-mounted projects
    # whose host uid differs from the container's uid.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - FOWNER
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777
    ports:
      - "127.0.0.1:${GATESHIP_PORT:-7777}:7777"
    volumes:
      - ${GATESHIP_PROJECT_DIR:-.}:/workspace
      - gateship-state:/workspace/.gship
    stdin_open: true
    tty: true

volumes:
  gateship-state:
